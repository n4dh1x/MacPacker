# Finish the first build's catalog metadata from its cached compiler output.
# Subsequent release builds perform the same sync before tagging the release.
name: Sync Fork Localization Catalogs

on:
  push:
    branches: [feat/one-click-extraction]
    paths:
      - '.github/workflows/sync-fork-catalogs.yml'
      - 'scripts/sync-localizations.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'n4dh1x/MacPacker'
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Identify the Xcode cache
        shell: bash
        run: |
          toolchain_hash=$(xcodebuild -version | shasum -a 256 | cut -c 1-12)
          echo "TOOLCHAIN_HASH=$toolchain_hash" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        with:
          path: |
            Modules/.build
            ${{ runner.temp }}/MacPackerBuild
          key: catalog-sync-${{ github.run_id }}
          restore-keys: |
            fork-build-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_HASH }}-${{ hashFiles('Modules/Package.resolved', 'MacPacker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
          fail-on-cache-miss: true

      - name: Sync catalogs using Apple's tool and verify the new settings keys
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sync-localizations.sh "$RUNNER_TEMP/MacPackerBuild"
          python3 - <<'PY'
          import json
          from pathlib import Path
          strings = json.loads(Path('MacPacker/Localizable.xcstrings').read_text())['strings']
          expected = {
              'One-click extraction', 'Extract archives when opened',
              'Same folder as the archive', 'Folder named after the archive',
              'Ask for a location', 'Extract to',
          }
          assert expected <= strings.keys(), expected - strings.keys()
          assert all(strings[key].get('comment') for key in expected)
          print('All six one-click settings keys and translator comments were generated.')
          PY

      - name: Commit the generated catalogs
        shell: bash
        run: |
          set -euo pipefail
          git add -- MacPacker/Localizable.xcstrings MacPacker/LeanBytes.xcstrings
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'lang: sync Xcode-generated one-click settings strings'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
